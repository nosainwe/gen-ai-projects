name: tests
on: [push, pull_request]
jobs:
  sketch-to-image-controlnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sketch-to-image-controlnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q   # python -m puts the project folder on the path, so "src" imports
